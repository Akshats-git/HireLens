# =============================================================================
# HireLens — DVC params file
# All values here are read by dvc.yaml stages. Edit this file to tune the
# pipeline without touching source code.
# =============================================================================

data:
  random_seed: 42
  min_resume_chars: 200
  max_resume_chars: 15000
  train_val_test_split: [0.80, 0.10, 0.10]
  remove_pii: true
  normalize_whitespace: true

synthetic:
  num_samples: 5000
  noise_level: 0.15
  random_seed: 42

model:
  base_name: sentence-transformers/all-MiniLM-L6-v2
  max_seq_length: 256
  embedding_dim: 384
  device: auto

fine_tuning:
  num_train_epochs: 5
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  learning_rate: 2.0e-5
  warmup_steps: 200
  weight_decay: 0.01
  lr_scheduler_type: cosine
  fp16: true
  save_total_limit: 2
  logging_steps: 50

scoring:
  weights:
    skills_match: 0.40
    experience_relevance: 0.30
    education_fit: 0.15
    keyword_alignment: 0.15
  thresholds:
    excellent: 85
    good: 70
    fair: 50

evaluation:
  k_values: [1, 3, 5, 10]
  num_eval_samples: 1000
  target_metrics:
    precision_at_1: 0.85
    ndcg_at_10: 0.80
    auc_roc: 0.80
    ner_f1: 0.75

monitor:
  retraining_threshold:
    precision_at_1: 0.85
    auc_roc: 0.78
  check_interval_hours: 24
  alert_log_path: logs/monitor_alerts.log
