# =============================================================================
# Frontend container: serves the built SPA and proxies the API.
#
# In production an nginx on the EC2 host terminates :80 and routes /api/ to the
# backend directly (see aws/setup-ec2.sh), so it never reaches this block. The
# proxy here is what makes the container self-contained under docker compose,
# where the browser talks to this server on :3000 and the API must be reachable
# at the same origin — the SPA calls relative /api paths.
# =============================================================================

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable in proxy_pass defers
    # lookup to request time: a static upstream is resolved once at startup, so
    # nginx refuses to boot if the backend is not yet up and keeps serving a
    # stale IP after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin "http://backend:8000";

    # Bulk uploads carry up to 50 PDFs; the default 1 MB cap rejects them.
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The API is same-origin via the proxy below, so 'self' covers every request
    # the page makes. Vite inlines styles, hence 'unsafe-inline' for style-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        # No URI after the variable: the original /api/... path is forwarded as-is.
        proxy_pass         $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Bulk scoring of 50 resumes runs well past the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    location /health {
        proxy_pass $backend_origin;
        access_log off;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: client-side routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(env|git|htaccess|htpasswd)$ {
        deny all;
    }
}
