# =============================================================================
# HireLens — DVC Pipeline
# Run the full pipeline:   dvc repro
# Run a single stage:      dvc repro <stage>
# Show DAG:                dvc dag
# Check metrics:           dvc metrics show
# Compare runs:            dvc metrics diff
#
# Tunable parameters live in configs/config.yaml. The `params` block of each
# stage lists the keys that stage actually consumes, so editing an unrelated
# key does not force a rerun.
# =============================================================================

stages:

  # ── 1. Data Ingestion ────────────────────────────────────────────────────────
  ingest:
    cmd: python -m src.data.data_pipeline --stage ingest
    deps:
      - src/data/ingestion.py
      - src/data/data_pipeline.py
    params:
      - configs/config.yaml:
          - data.resume_dataset
          - data.jobs_dataset
    outs:
      - data/raw/resumes_clean.csv
      - data/raw/jobs_clean.csv
    metrics:
      - logs/dataset_distributions.json:
          cache: false
    desc: "Download and clean raw resume + job-posting data from Kaggle"

  # ── 2. Preprocessing ─────────────────────────────────────────────────────────
  preprocess:
    cmd: python -m src.data.data_pipeline --stage preprocess
    deps:
      - src/data/preprocessing.py
      - src/data/data_pipeline.py
      - data/raw/resumes_clean.csv
      - data/raw/jobs_clean.csv
    params:
      - configs/config.yaml:
          - data.random_seed
          - data.preprocessing
          - data.train_val_test_split
    outs:
      - data/processed/resumes_processed.csv
      - data/processed/jobs_processed.csv
      - data/processed/train_pairs.csv
      - data/processed/val_pairs.csv
      - data/processed/test_pairs.csv
    desc: "Build train/val/test pairs with weak-supervision labels"

  # ── 3. Evaluation Set Construction ───────────────────────────────────────────
  eval_set:
    cmd: python -m src.data.data_pipeline --stage eval-set
    deps:
      - src/data/eval_dataset.py
      - src/data/data_pipeline.py
      - data/raw/jobs_clean.csv
      - data/raw/eval_dataset/resume_dataset_1200.csv
    params:
      - configs/config.yaml:
          - data.random_seed
          - data.eval_set
    outs:
      - data/eval/eval_pairs.csv
    desc: "Score structured resumes against real job postings to build a held-out eval set"

  # ── 4. Model Training ────────────────────────────────────────────────────────
  train:
    cmd: python -m src.models.train --run-name dvc-auto
    deps:
      - src/models/train.py
      - data/processed/train_pairs.csv
      - data/processed/val_pairs.csv
    params:
      - configs/config.yaml:
          - model.base
          - model.fine_tuning
    outs:
      - models/fine_tuned/hirelens_matcher:
          cache: true
          persist: true
    metrics:
      - logs/training_metrics.json:
          cache: false
    desc: "Fine-tune all-MiniLM-L6-v2 with CosineSimilarityLoss on GTX 1650"

  # ── 5. Evaluation ────────────────────────────────────────────────────────────
  evaluate:
    cmd: python -m src.evaluation.metrics
    deps:
      - src/evaluation/metrics.py
      - src/features/ner.py
      - src/data/eval_dataset.py
      - models/fine_tuned/hirelens_matcher
      - data/processed/test_pairs.csv
      - data/raw/eval_dataset/resume_dataset_1200.csv
      - data/skills_taxonomy.json
    params:
      - configs/config.yaml:
          - model.base.name
          - model.ner
          - evaluation
    metrics:
      - logs/evaluation_report.json:
          cache: false
    desc: "Compute P@K, NDCG@K, AUC-ROC, MRR, and NER F1 on held-out test set"
