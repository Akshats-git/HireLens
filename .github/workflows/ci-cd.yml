name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hirelens-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hirelens-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================================
  # Job 1 — Python lint + tests  (every push and PR — no secrets needed)
  # ============================================================================
  test-backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi==0.111.1 uvicorn==0.30.3 \
            pydantic==2.8.2 pydantic-settings==2.3.4 \
            python-multipart==0.0.9 httpx==0.27.0 aiofiles==23.2.1 \
            redis>=5.0.0 pdfplumber==0.11.2 PyMuPDF==1.24.7 \
            pytest==8.2.2 pytest-asyncio==0.23.7 pytest-cov==5.0.0 \
            black==24.4.2 flake8==7.1.0 \
            loguru==0.7.2 PyYAML==6.0.2 \
            sentence-transformers==3.0.1 scikit-learn==1.5.1 \
            numpy==1.26.4 pandas==2.2.2

      - name: Black formatting check
        run: black --check --diff backend/ src/ tests/ registry/ monitor.py

      - name: Flake8 lint
        run: |
          flake8 backend/ src/ tests/ registry/ monitor.py \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=.venv,__pycache__

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v \
            --cov=backend --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short -q

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ============================================================================
  # Job 2 — Frontend build check  (every push and PR — no secrets needed)
  # ============================================================================
  test-frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ============================================================================
  # Job 3 — Build & push to ghcr.io  (main branch push only)
  # Uses GitHub's built-in GITHUB_TOKEN — no extra secrets needed for this job.
  # ============================================================================
  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatically provided, no setup

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/hirelens-backend:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/hirelens-backend:latest
          build-args: PYTHON_VERSION=3.12.3

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/hirelens-frontend:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/hirelens-frontend:latest
          build-args: VITE_API_URL=http://localhost:8000

      - name: Save SHA for deploy
        run: echo "${{ steps.meta.outputs.sha }}" > image_sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-sha
          path: image_sha.txt

  # ============================================================================
  # Job 4 — Deploy to EC2  (main branch push only)
  # Secrets needed: EC2_HOST, EC2_SSH_KEY, POSTGRES_PASSWORD
  # ============================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-sha

      - name: Read image SHA
        id: sha
        run: echo "value=$(cat image_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_SHA: ${{ steps.sha.outputs.value }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_SHA,GHCR_USER,GHCR_TOKEN,POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/hirelens

            # Pull latest images from ghcr.io
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Rolling restart — postgres/redis keep running
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            GHCR_USER="$GHCR_USER" \
              docker compose -f docker-compose.prod.yml up -d --no-build backend frontend

            # Smoke test
            sleep 20
            curl -fsSL http://localhost:8000/health | grep '"status":"healthy"'
            echo "Deploy $IMAGE_SHA complete."

      - name: Notify success
        if: success()
        run: echo "::notice title=Deployed::${{ steps.sha.outputs.value }} is live"

      - name: Notify failure
        if: failure()
        run: echo "::error title=Deploy failed::Check the SSH deploy logs"
