# =============================================================================
# HireLens — master configuration
#
# This is the single source of truth for tunable parameters. Application code
# reads it directly; DVC tracks the keys listed under `params:` in dvc.yaml so
# that changing a value invalidates the affected pipeline stages.
#
# Secrets and deployment-specific values belong in .env, never here.
# =============================================================================

app:
  name: HireLens
  version: "1.0.0"

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  base:
    name: sentence-transformers/all-MiniLM-L6-v2
    # all-MiniLM-L6-v2 truncates beyond 256 tokens; raising this wastes compute.
    max_seq_length: 256
    embedding_dim: 384
    device: auto                           # auto | cpu | cuda

  fine_tuning:
    output_dir: models/fine_tuned/hirelens_matcher
    num_train_epochs: 5
    per_device_train_batch_size: 32        # Fits 4 GB VRAM at seq len 256
    per_device_eval_batch_size: 64
    warmup_steps: 200
    weight_decay: 0.01
    learning_rate: 2.0e-5
    lr_scheduler_type: cosine
    save_strategy: epoch
    evaluation_strategy: epoch
    load_best_model_at_end: true
    metric_for_best_model: eval_val_spearman_cosine
    fp16: true
    save_total_limit: 2
    logging_steps: 50

  ner:
    model: en_core_web_trf
    fallback_model: en_core_web_sm
    batch_size: 128                        # spaCy nlp.pipe batch size

# ── Scoring ───────────────────────────────────────────────────────────────────
scoring:
  weights:
    skills_match: 0.40
    experience_relevance: 0.30
    education_fit: 0.15
    keyword_alignment: 0.15

  # Percentage cutoffs for the human-readable match label.
  thresholds:
    excellent: 85
    good: 70
    fair: 50

  # Lower bound (in years) for each experience tier, highest tier first.
  experience_levels:
    lead: 10
    senior: 5
    mid: 2
    entry: 0

# ── Semantic similarity ───────────────────────────────────────────────────────
similarity:
  top_k_keywords: 20            # JD keywords considered for keyword alignment

# ── Data pipeline ─────────────────────────────────────────────────────────────
data:
  random_seed: 42
  resume_dataset: snehaanbhawal/resume-dataset
  jobs_dataset: arshkon/linkedin-job-postings
  eval_dataset: sayyedfaizan95/resume-and-job-description

  preprocessing:
    min_resume_chars: 100         # Cleaned resumes shorter than this are dropped
    min_jd_chars: 50
    negatives_per_positive: 2

  # Fractions of the pair set assigned to train / validation / test.
  train_val_test_split: [0.80, 0.10, 0.10]

  eval_set:
    # Job descriptions sampled once up front, then reused for every resume.
    jobs_pool_size: 5000
    pairs_per_resume: 2

# ── API ───────────────────────────────────────────────────────────────────────
api:
  max_upload_size_mb: 10
  max_bulk_resumes: 50
  analysis_cache_ttl_seconds: 3600
  bulk_worker_threads: 8
  # Batches older than this are evicted from the recruiter result store.
  result_store_ttl_seconds: 3600

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  experiment_name: hirelens-resume-matching
  registered_model_name: hirelens-matcher
  run_tags:
    project: HireLens
    team: ml-eng

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  k_values: [1, 3, 5, 10]
  num_eval_samples: 1000
  ner_eval_samples: 200

  # Project targets, reported on every evaluation run. These are aspirational
  # and a miss does not block anything — see promotion_thresholds for the gate.
  #
  # P@1 is the meaningful precision cutoff here: each resume group holds
  # 1 positive and 2 negatives, so P@5 and P@10 are capped well below 1.0.
  target_metrics:
    precision_at_1: 0.85
    ndcg_at_10: 0.80
    auc_roc: 0.80
    ner_f1: 0.88

  # Metrics that gate promotion of a model version to the production alias.
  promotion_thresholds:
    precision_at_1: 0.85
    auc_roc: 0.78
    ner_f1: 0.72

# ── Retraining monitor ────────────────────────────────────────────────────────
monitor:
  check_interval_hours: 24
  retraining_thresholds:
    precision_at_1: 0.85
    auc_roc: 0.78

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level:<8} | {name}:{function}:{line} | {message}"
  rotation: "100 MB"
  retention: "30 days"
